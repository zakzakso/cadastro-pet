<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Pet com Imagem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-card">
        <h2>Cadastrar Pet</h2>
        <form id="petForm">
            <input type="text" id="tutor" placeholder="Nome do Tutor" required>
            <input type="text" id="nomePet" placeholder="Nome do Animal" required>
            <input type="text" id="raca" placeholder="Raça" required>

            <select id="genero" required>
                <option value="">Gênero...</option>
                <option value="Fêmea">Fêmea</option>
                <option value="Macho">Macho</option>
            </select>

            <input type="number" id="peso" step="0.1" placeholder="Peso (kg)" required>
            <input type="number" id="idade" placeholder="Idade (anos)" required>

            <!-- Campo de Upload de Imagem -->
            <label for="imagem">Foto do Pet:</label>
            <input type="file" id="imagem" accept="image/*" required>

            <button type="submit">Cadastrar</button>
        </form>
    </div>
    <script src="script-pet.js"></script>
</body>
</html>
